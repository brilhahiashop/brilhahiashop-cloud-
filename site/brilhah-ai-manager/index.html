.section{margin-top:14px}.sectionHead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:9px}.sectionHead h2{font-size:17px;margin:0}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px}.metric small{color:var(--mut)}.metric b{display:block;font-size:26px;margin-top:6px}.metric em{font-style:normal;color:var(--mut);font-size:11px}.list{display:grid;gap:8px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:13px}.meta b{display:block}.meta small{display:block;color:var(--mut);margin-top:4px;line-height:1.35}.status{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:6px 9px;white-space:nowrap}.connected,.done,.ready{color:var(--green)}.pending{color:var(--amber)}.failed,.critical{color:var(--red)}.inline{display:flex;flex-wrap:wrap;gap:7px;align-items:center}.mut{color:var(--mut)}.empty{padding:24px;text-align:center;border:1px dashed var(--line);border-radius:14px;color:var(--mut)}.tableWrap{overflow:auto;border:1px solid var(--line);border-radius:14px}.table{width:100%;border-collapse:collapse;min-width:800px}.table th,.table td{padding:11px;border-bottom:1px solid var(--line);text-align:left;font-size:12px;vertical-align:top}.table th{color:#9fb0c8;background:#0a1322}.productGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.product{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}.product img{width:100%;height:200px;object-fit:cover}.product .p{padding:12px}.price{font-weight:900;color:var(--cyan);font-size:20px}.drawer{position:fixed;right:0;top:0;bottom:0;width:min(520px,94vw);background:#0a1322;border-left:1px solid var(--line);z-index:50;padding:20px;overflow:auto}.bottomNav{display:none}
@media(max-width:980px){.sidebar{transform:translateX(-105%);transition:.2s}.sidebar.open{transform:translateX(0)}.main{margin-left:0;padding:12px 12px 94px}.menu{display:inline-block}.grid4{grid-template-columns:repeat(2,1fr)}.grid3{grid-template-columns:1fr 1fr}.productGrid{grid-template-columns:1fr 1fr}.bottomNav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:rgba(7,16,29,.98);border-top:1px solid var(--line);z-index:20;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}.bottomNav button{border:0;background:transparent;color:#93a3bb;padding:7px 2px;font-size:10px;border-radius:10px}.bottomNav button.active{background:#13213a;color:#fff}.actions .desktop{display:none}.top h1{font-size:23px}}

.dashboardHello{margin:14px 0 12px;padding:18px;background:linear-gradient(135deg,#101a2d,#13213a);border:1px solid var(--line);border-radius:18px;display:flex;align-items:center;justify-content:space-between;gap:18px}.dashboardHello small{color:var(--cyan);font-size:10px;font-weight:900;letter-spacing:.16em}.dashboardHello h2{margin:5px 0 4px;font-size:22px}.dashboardHello p{margin:0;color:var(--mut);font-size:12px}.liveBadge{display:inline-flex;align-items:center;gap:7px;border:1px solid #275f42;background:#10281a;color:#bff4d2;border-radius:999px;padding:8px 11px;font-size:11px;white-space:nowrap}.liveBadge i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(98,217,141,.12)}.quickActions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.quickAction{display:flex;align-items:center;gap:11px;text-align:left;background:var(--card);border:1px solid var(--line);color:#fff;border-radius:15px;padding:14px;cursor:pointer;min-height:72px;transition:.16s}.quickAction:hover,.quickAction:active{transform:translateY(-2px);border-color:#45638f;background:#13213a}.quickAction>b{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;background:#0b1423;color:var(--cyan);font-size:17px}.quickAction span{font-weight:800;font-size:12px}.quickAction small{display:block;color:var(--mut);font-weight:500;margin-top:3px}.loadingCard,.errorCard{margin-top:16px;min-height:180px;background:var(--card);border:1px solid var(--line);border-radius:18px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:9px;text-align:center;padding:24px}.loadingCard small,.errorCard span{color:var(--mut);font-size:12px}.spinner{width:28px;height:28px;border:3px solid #243551;border-top-color:var(--cyan);border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:760px){.dashboardHello{align-items:flex-start;flex-direction:column}.quickActions{grid-template-columns:1fr 1fr}}@media(max-width:440px){.quickActions{grid-template-columns:1fr}.dashboardHello{padding:15px}.grid4{gap:8px}.metric b{font-size:23px}}

.studioHero{display:flex;justify-content:space-between;align-items:center;gap:16px}.studioHero h2{margin:6px 0}.brand{color:var(--cyan);font-size:11px;font-weight:900;letter-spacing:.12em}.copilotWelcome h2{margin:8px 0 4px;font-size:30px}.quickGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.quick{background:var(--card);border:1px solid var(--line);border-radius:16px;color:#fff;padding:14px;text-align:left;min-height:100px}.quick b,.quick small{display:block}.quick b{margin-top:10px}.quick small{color:var(--mut);margin-top:4px}.copilotBox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}.copilotLog{display:grid;gap:8px;max-height:300px;overflow:auto}.bubble{padding:10px 12px;border-radius:13px;max-width:90%}.bubble.ai{background:#13213a}.bubble.user{background:#294c72;margin-left:auto}.copilotComposer{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}.copilotComposer input{background:#0a1322;color:#fff;border:1px solid var(--line);border-radius:12px;padding:13px;min-width:0}.miniLink{border:0;background:none;color:var(--cyan);font-weight:800}@media(max-width:760px){.studioHero{flex-direction:column;align-items:stretch}.quickGrid{grid-template-columns:repeat(2,1fr)}}
.critical{color:var(--red)}
</style>

<script type="module">
import{createClient}from"https://esm.sh/@supabase/supabase-js@2.57.4";
const U="https://lnezqvonjcvhgaogndqh.supabase.co",K="sb_publishable_bm64tpscRoPyieo2qQqpCQ_BNSX-TcC",A=U+"/functions/v1/brilhah-api";
const s=createClient(U,K,{auth:{persistSession:true,autoRefreshToken:true}});
const $=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const money=v=>v===null||v===undefined||v===""?"—":Number(v).toLocaleString("pt-PT",{style:"currency",currency:"EUR"});
let current="dashboard",hist=["dashboard"],cache={},mfaFactor=null;
const titles={dashboard:["Início","Operação BRILHAH em tempo real."],company:["Empresa 360º","Estado global da empresa, riscos e próximos controlos."],copilot:["Copiloto IA","Comandos inteligentes sobre os dados reais da BRILHAH."],alerts:["Alertas","Só o que exige atenção ou decisão."],email:["Atendimento","Apenas mensagens novas."],whatsapp:["WhatsApp","Automação e escalamento humano."],orders:["Encomendas","Pedidos e fulfillment."],products:["Catálogo","Em reconstrução · apenas produtos reais aprovados."],pricing:["Preço & Margem","Custos e recomendação por mercado."],suppliers:["Fornecedores","Condições operacionais."],markets:["Mercados","Cobertura ativa."],returns:["Devoluções","Ocorrências e pós-venda."],marketing:["Marketing","Tráfego e conversão."],revenues:["Receitas & Monetização","Receita real separada de canais preparados."],billing:["Faturação","Só ações pendentes."],fiscality:["Fiscalidade","Estado fiscal operacional."],tasks:["Tarefas","Pendentes e concluídas."],content:["Conteúdo","Fila de produção."],customers:["Clientes","Base de clientes."],approvals:["Aprovações","Decisões humanas."],connections:["Integrações","Estado técnico real."],launch:["Estado","Pendências reais, sem ruído."]};
async function token(){const{data}=await s.auth.getSession();return data.session?.access_token||""}
async function api(resource,opt={}){const t=await token();const r=await fetch(A+"?resource="+encodeURIComponent(resource),{...opt,headers:{"content-type":"application/json","authorization":"Bearer "+t,...(opt.headers||{})}});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.message||j.error||"Erro");return j}
function metric(a,b,c){return'<div class="card metric"><small>'+esc(a)+'</small><b>'+esc(b)+'</b><em>'+esc(c||"")+'</em></div>'}
function empty(t){return'<div class="empty">'+esc(t)+'</div>'}
async function routeAuth(){const{data:{session}}=await s.auth.getSession();if(!session){$("auth").classList.remove("hidden");$("app").classList.add("hidden");return}const aal=await s.auth.mfa.getAuthenticatorAssuranceLevel();if(aal.data?.currentLevel!=="aal2"){const f=await s.auth.mfa.listFactors();mfaFactor=(f.data?.totp||[]).find(x=>x.status==="verified")||null;if(mfaFactor){$("loginBox").classList.add("hidden");$("mfaBox").classList.remove("hidden");$("auth").classList.remove("hidden");$("app").classList.add("hidden");return}}$("auth").classList.add("hidden");$("app").classList.remove("hidden");await load("dashboard",false)}
$("loginBtn").onclick=async()=>{try{$("loginMsg").textContent="A entrar…";const{error}=await s.auth.signInWithPassword({email:$("email").value,password:$("password").value});if(error)throw error;await routeAuth()}catch(e){$("loginMsg").textContent=e.message;$("loginMsg").className="msg err"}};
$("mfaBtn").onclick=async()=>{try{if(!mfaFactor)throw Error("Fator MFA não encontrado");const c=await s.auth.mfa.challenge({factorId:mfaFactor.id});if(c.error)throw c.error;const v=await s.auth.mfa.verify({factorId:mfaFactor.id,challengeId:c.data.id,code:$("mfaCode").value});if(v.error)throw v.error;await routeAuth()}catch(e){$("mfaMsg").textContent=e.message;$("mfaMsg").className="msg err"}};
$("logoutBtn").onclick=async()=>{await s.auth.signOut();location.reload()};
function setActive(v){document.querySelectorAll("[data-view]").forEach(b=>b.classList.toggle("active",b.dataset.view===v));document.querySelectorAll("[data-bottom]").forEach(b=>b.classList.toggle("active",b.dataset.bottom===v))}
async function dashboard(){
 const [d,g]=await Promise.all([api("dashboard"),api("website-growth").catch(()=>({}))]);
 const c=d.counts||{},m=d.latest_metrics||{},channels=d.channels||[];
 const conv=(Number(m.conversion_rate||0)*100).toLocaleString("pt-PT",{minimumFractionDigits:1,maximumFractionDigits:1})+"%";
 const updated=new Date().toLocaleTimeString("pt-PT",{hour:"2-digit",minute:"2-digit"});
 return '<div class="dashboardHello"><div><small>COMMAND CENTER</small><h2>BRILHAH em tempo real</h2><p>Vendas, operação, site e canais num único ecrã.</p></div><span class="liveBadge"><i></i> atualizado '+esc(updated)+'</span></div>'+
 '<div class="grid4">'+metric("Encomendas",c.orders||0,"registadas")+metric("Produtos",c.products||0,"ativos")+metric("Emails novos",c.unread_email||0,"Gmail")+metric("Aprovações",c.pending_approvals||0,"pendentes")+'</div>'+
 '<div class="section"><div class="sectionHead"><h2>Negócio · 30 dias</h2><span class="status connected">Shopify ligado</span></div><div class="grid4">'+metric("Sessões",m.sessions||0,"Shopify Analytics")+metric("Vendas",money(m.total_sales||0),"receita registada")+metric("Conversão",conv,"checkout concluído")+metric("Ticket médio",money(m.average_order_value||0),"por encomenda")+'</div></div>'+
 '<div class="section"><div class="sectionHead"><h2>BRILHAH.com · 7 dias</h2><span class="status connected">site ligado</span></div><div class="grid4">'+metric("Visitas no site",g.page_views_7d||0,"páginas vistas")+metric("Subscritores",g.subscribers_total||0,(g.subscribers_7d||0)+" novos em 7d")+metric("Cliques para loja",g.shop_clicks_7d||0,"intenção de compra")+metric("WhatsApp",g.whatsapp_clicks_7d||0,"pedidos de apoio")+'</div></div>'+
 '<div class="section"><div class="sectionHead"><h2>Ações rápidas</h2><span class="mut">um toque</span></div><div class="quickActions">'+
 '<button class="quickAction" data-jump="orders"><b>▣</b><span>Encomendas<small>Ver pedidos e estados</small></span></button>'+
 '<button class="quickAction" data-jump="pricing"><b>€</b><span>Preço & Margem<small>Controlar rentabilidade</small></span></button>'+
 '<button class="quickAction" data-jump="content"><b>▶</b><span>Conteúdo<small>Criar e acompanhar</small></span></button>'+
 '<button class="quickAction" data-jump="marketing"><b>↗</b><span>Marketing<small>Tráfego e conversão</small></span></button>'+
 '<button class="quickAction" data-jump="billing"><b>▤</b><span>Faturação<small>Pendências fiscais</small></span></button>'+
 '<button class="quickAction" data-jump="connections"><b>⌁</b><span>Integrações<small>Estado dos canais</small></span></button>'+
 '</div></div>'+
 '<div class="section"><div class="sectionHead"><h2>Integrações principais</h2></div><div class="list">'+channels.filter(x=>["shopify","email","supabase","vercel","website_growth","whatsapp","meta"].includes(x.channel)).map(x=>'<div class="row"><div class="meta"><b>'+esc(x.channel==="website_growth"?"SITE":x.channel.toUpperCase())+'</b><small>'+esc(x.account_label||"")+'</small></div><span class="status '+(x.status==="connected"?"connected":"pending")+'">'+esc(x.status==="connected"?"ligado":"pendente")+'</span></div>').join("")+'</div></div>'
}
async function email(){const d=await api("email");cache.email=d;return'<div class="sectionHead"><h2>Novos emails</h2><button id="allRead" class="btn primary" '+(!(d.messages||[]).length?"disabled":"")+'>Tudo lido ✓</button></div>'+((d.messages||[]).length?'<div class="list">'+d.messages.map((e,i)=>'<div class="row" data-email="'+i+'" style="cursor:pointer"><div class="meta"><b>'+esc(e.subject)+'</b><small>'+esc(e.sender)+' · '+esc(e.snippet||"")+'</small></div><span class="status pending">novo</span></div>').join("")+'</div>':empty("Sem emails novos."))}

 x.font="500 28px system-ui";x.fillText((prompt||product.name).slice(0,42),42,1022);x.fillStyle="#f5a879";x.font="800 34px system-ui";x.fillText(Number(product.sale_price||19.99).toLocaleString("pt-PT",{style:"currency",currency:"EUR"}),42,1080);
 x.fillStyle="#fff";x.fillRect(42,1140,260,62);x.fillStyle="#111";x.font="800 23px system-ui";x.fillText("VISITA A LOJA",62,1179);
